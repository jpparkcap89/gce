<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>GCE 통신 브리지</title></head>
<body>
<script>
'use strict';
// HTML 템플릿의 contextual escaping을 이용해 주입합니다.
const ALLOWED_ORIGIN = <?!= JSON.stringify(allowedOrigin) ?>;
const BRIDGE_NONCE = <?!= JSON.stringify(nonce) ?>;
const CHANNEL = 'GCE_GAS_BRIDGE_V1';
const METHODS = new Set([
  'getPracticeData', 'loginAdmin', 'logoutAdmin',
  'getAdminData', 'saveQuestion', 'getLectureData', 'getEnglishScenarios'
]);
function send(message) {
  window.top.postMessage({channel:CHANNEL,nonce:BRIDGE_NONCE,...message},ALLOWED_ORIGIN);
}
window.addEventListener('message',function(event) {
  if(event.source!==window.top || event.origin!==ALLOWED_ORIGIN) return;
  const m=event.data;
  if(!m || m.channel!==CHANNEL || m.nonce!==BRIDGE_NONCE) return;
  if(m.type==='hello') { send({type:'ready'}); return; }
  if(m.type!=='request') return;
  const id=m.id;
  if(!Number.isSafeInteger(id) || id<=0 || !METHODS.has(m.method) ||
     !Array.isArray(m.args) || m.args.length>4) {
    send({type:'response',id,ok:false,error:'허용하지 않은 요청입니다.'});
    return;
  }
  try {
    google.script.run
      .withSuccessHandler(result=>send({type:'response',id,ok:true,result}))
      .withFailureHandler(error=>send({type:'response',id,ok:false,error:error && error.message || String(error)}))
      [m.method](...m.args);
  } catch(error) {
    send({type:'response',id,ok:false,error:error.message || String(error)});
  }
});
send({type:'ready'});
</script>
</body>
</html>
